name: Deploy to GitHub Pages

# Manual-only on purpose: GitHub Pages needs a public repo on a free account,
# and an automatic push trigger would just fail on every commit. If you make the
# repo public (or move to a paid plan), uncomment the push block below and set
# Settings -> Pages -> Source to "GitHub Actions".
on:
  workflow_dispatch:
  # push:
  #   branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# never let two deploys race each other
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          # a project site lives at https://<user>.github.io/<repo>/ —
          # this makes the asset URLs match
          VITE_BASE: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
